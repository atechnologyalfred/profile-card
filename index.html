<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile Card</title>
<style>

* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: #f3f4f6;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Card */
.profile-card {
  width: 320px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  overflow: hidden;
  text-align: center;
}

/* Top Gradient */
.profile-header {
  height: 120px;
  background: linear-gradient(150deg, #7950f2d5, #8e008ec7);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Avatar circle */
.avatar {
  width: 70px;
  height: 70px;
  background: white;
  border-radius: 50%;
  border: 5px solid white;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Icon */
.avatar img {
  width: 70px;
  height: 70px;
}

/* Body */
.profile-body {
  padding: 24px 20px 25px;
}

.profile-body h2 {
  margin: 0;
  font-size: 18px;
  color: #333;
}

.profile-body p {
  margin: 5px 0 20px;
  font-size: 13px;
  color: #777;
}

/* Stats */
.stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.stats div {
  flex: 1;
}

.stats h3 {
  margin: 0;
  font-size: 16px;
  color: #9873e9;
}

.stats span {
  font-size: 12px;
  color: #888;
}

/* Button */
.follow-btn {
  background: linear-gradient(135deg, #6a7cff, #7b4ddb);
  color: white;
  border: none;
  padding: 10px 28px;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
}

.follow-btn:hover {
  opacity: 0.9;
}

</style>
</head>
<body>

<div class="profile-card">
  <div class="profile-header">
    <div class="avatar">
      <!-- BOY ICON  -->
      <img src="profile-img.png" alt="icon of a boy used to represent the profile picture" class="img">
    </div>
  </div>

  <div class="profile-body">
    <h2>John Doe</h2>
    <p>Web Developer</p>

    <div class="stats">
      <div>
        <h3>523</h3>
        <span>Posts</span>
      </div>
      <div>
        <h3>1.2K</h3>
        <span>Followers</span>
      </div>
      <div>
        <h3>346</h3>
        <span>Following</span>
      </div>
    </div>

    <button class="follow-btn">Follow</button>
  </div>
</div>

</body>
</html>
